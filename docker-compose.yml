version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskpulse_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: always

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskpulse_ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always

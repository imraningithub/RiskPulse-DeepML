services:
  # 1. FastAPI Microservice REST API
  - type: web
    name: riskpulse-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

  # 2. Streamlit Web UI Dashboard
  - type: web
    name: riskpulse-ui
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run ui/app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_URL
        value: https://riskpulse-api-4alt.onrender.com
